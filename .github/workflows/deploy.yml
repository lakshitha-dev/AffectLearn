# Deploy AffectLearn to Azure App Service on push to main.
# Secrets required (repo settings -> Secrets and variables -> Actions):
#   AZURE_WEBAPP_PUBLISH_PROFILE           - backend App Service publish profile XML
#   AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND  - frontend App Service publish profile XML
#   FACIAL_MODEL_URL                       - read-SAS URL to cnn_lstm_best.onnx in Blob (gitignored, 46MB)
# Backend: Python code, Oryx build on App Service (SCM_DO_BUILD_DURING_DEPLOYMENT=true),
#          startup runs backend/startup.sh (alembic upgrade -> uvicorn).
# Frontend: Next.js standalone build done HERE on the runner (B1 plan would OOM on
#           `next build`); the small .next/standalone bundle is deployed and run with
#           `node server.js` (SCM build disabled on the frontend app).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-affectlearn
  cancel-in-progress: true

env:
  AZURE_BACKEND_APP: affectlearn-api-4905
  AZURE_FRONTEND_APP: affectlearn-web-4905
  BACKEND_BASE_URL: https://affectlearn-api-4905.azurewebsites.net

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch facial model from Blob (gitignored, 46MB)
        run: |
          mkdir -p backend/models
          curl -fsSL "${{ secrets.FACIAL_MODEL_URL }}" -o backend/models/cnn_lstm_best.onnx
          echo "models present:"; ls -la backend/models

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_BACKEND_APP }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

      - name: Summary
        run: echo "Deployed backend -> ${{ env.BACKEND_BASE_URL }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Next.js (standalone)
        working-directory: frontend
        env:
          # NEXT_PUBLIC_* are inlined at build time. API_URL includes /api/v1;
          # WS_URL is the base only (the client appends /api/v1/ws).
          NEXT_PUBLIC_API_URL: ${{ env.BACKEND_BASE_URL }}/api/v1
          NEXT_PUBLIC_WS_URL: wss://affectlearn-api-4905.azurewebsites.net
        run: |
          npm ci
          npm run build
          # Assemble the self-contained runtime: standalone server + static + public.
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          echo "standalone bundle:"; ls -la .next/standalone

      - name: Deploy frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_FRONTEND_APP }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: frontend/.next/standalone

      - name: Summary
        run: echo "Deployed frontend -> https://${{ env.AZURE_FRONTEND_APP }}.azurewebsites.net"
