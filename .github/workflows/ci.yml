# CI — runs the test suites on every pull request, and on push to the long-lived branches.
#
# WHY THIS EXISTS IN THIS FORM
#
# The previous version was a placeholder (`echo "CI pipeline - to be configured"`) triggered only
# by a push to `main`. With no `pull_request` trigger, no pull request in this repository has ever
# been gated by a test run — including the one that added a second affect channel and rewrote the
# participant-facing privacy copy. Every "tests pass" claim on a PR so far has come from a
# developer running them locally and reporting the result.
#
# Neither suite needs a service container: the backend fixtures use in-memory SQLite
# (`tests/conftest.py`), and the frontend runs under jsdom. So gating PRs costs a couple of
# minutes and no infrastructure.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          # `Settings()` is constructed at import time and DATABASE_URL / JWT_SECRET have no
          # defaults, so collection fails before a single test runs unless they are present.
          # Locally they come from a gitignored `.env`; a clean runner has neither. These values
          # are placeholders: the fixtures build their own in-memory SQLite engine
          # (`tests/conftest.py`) and never connect to DATABASE_URL, and no test verifies a token
          # signed with a real secret.
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: ci-placeholder-not-a-real-secret
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest
        working-directory: frontend
        run: npx vitest run

      # A green unit suite does not prove the app compiles: `vitest` transpiles per-module and
      # never type-checks the whole project or runs the Next.js build. The deploy workflow builds
      # on the runner, so a build break would otherwise surface only at deploy time, after review.
      - name: Type-check and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid/api/v1
          NEXT_PUBLIC_WS_URL: wss://example.invalid
        run: npm run build
