# CI — runs the three test suites on every pull request and on pushes to the long-lived branches.
#
# This file previously contained a single `echo "CI pipeline - to be configured"` step, triggered
# only on push to `main`. Since `main` sits behind `develop` and all work happens on feature
# branches, the practical effect was that no test ever ran automatically: the suites passed only
# when someone remembered to run them by hand. The thesis records configuring this as a
# prerequisite for the pilot, on the grounds that an analysis script which no longer runs is
# indistinguishable, in a repository, from one whose output is current.
#
# The backend suite uses SQLite via aiosqlite (see tests/conftest.py), so no database service is
# needed here. The e2e suite is deliberately NOT in this workflow — it needs the full stack up,
# which is a longer job than a PR gate should be.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

# A second push to the same branch supersedes the first: PR feedback is only useful for the
# current state of the branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Settings that must exist for `app.core.config.Settings()` to construct at IMPORT time.
#
# `DATABASE_URL` and `JWT_SECRET` have no defaults, so merely importing anything under `app.`
# raises a pydantic ValidationError without them. Locally that is masked by an untracked
# `backend/.env`; CI has no such file, which is why this workflow failed on its first real run
# while every developer machine passed.
#
# The DATABASE_URL VALUE is never used: `tests/conftest.py` builds its own in-memory SQLite
# engine. It only has to be present and well-formed.
#
# Defined once as a YAML anchor so a third job cannot be added without it and fail the same way.
x-test-env: &test-env
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/unused"
  JWT_SECRET: "ci-only-not-a-real-secret"
  # The retention sweep is a background task; a test run must never delete rows from under
  # itself. 0 disables it.
  RESEARCH_RETENTION_DAYS: "0"

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        # Non-blocking for now: the repository carries pre-existing findings that are unrelated to
        # any single change, and failing every PR on them would train people to ignore this job.
        # Remove `continue-on-error` once the backlog is cleared.
        continue-on-error: true
        run: ruff check app tests

      - name: Tests
        env: *test-env
        run: pytest -q

  frontend:
    name: Frontend (vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # Non-blocking for the same reason as the backend lint: the existing failures are in test
        # files and predate this workflow.
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests
        run: npx vitest run

  migrations:
    name: Migrations match models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Its own job because of what it guards. A model table or column with no migration passes
      # every other test — the suite builds its schema from `Base.metadata` — and fails only in
      # production, silently, on any code path that degrades rather than raises. That has already
      # happened once here: `learner_profiles` ran for weeks without existing.
      - name: Schema guard
        env: *test-env
        run: pytest tests/test_migrations_cover_models.py -q

      - name: Single migration head
        run: |
          heads=$(alembic heads | grep -c '(head)')
          if [ "$heads" -ne 1 ]; then
            echo "expected exactly one alembic head, found $heads"
            alembic heads
            exit 1
          fi
