services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src    # Hot reload for Next.js
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app           # Hot reload for uvicorn
      - ./backend/models:/app/models     # ML model artifacts (behavioral ONNX + stats; facial drop-in)
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/affectlearn
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-change-in-production
      - VLLM_ENDPOINT=http://vllm:8080
      # Affect models (defaults resolve to /app/models).
      #
      # Two COMPLEMENTARY channels, each authoritative for the one state it can observe:
      #   facial geometry -> bored      AUC 0.9225 on EngageNet, 26 held-out participants
      #   behavioural     -> confused   AUC 0.7473 on DUX, 46 sessions
      # They are not fused. The two detect DIFFERENT constructs, no corpus contains both, and on
      # the one paired dataset that exists fusion cost 0.012 AUC against behaviour alone. Worse,
      # weighted-averaging two disjoint votes halves each below ADAPT_MIN_CONFIDENCE -- the
      # documented zero-intervention failure -- so the decision is taken per channel instead.
      - AFFECT_MODEL_KIND=geometry
      - GEOMETRY_MODEL_PATH=models/engagenet_lean_gbdt.onnx
      - BEHAVIORAL_MODEL_PATH=models/behavioral_bilstm.onnx
      - BEHAVIORAL_STATS_PATH=models/behavioral_feature_stats.json
      - AFFECT_DETECTION_MODE=auto
      - FUSION_DRIVES_DECISION=false
      # `frustrated` is dropped: no model detects it, and listing it implies a capability that
      # does not exist. `bored` is included because it is reachable for the first time -- every
      # previous artifact pinned it at 0.0 in the canonical vector.
      - ADAPT_STATES=bored,confused
      # Retained so a rollback to the pixel path needs only AFFECT_MODEL_KIND changed back.
      - AFFECT_MODEL_PATH=models/cnn_lstm_confusion_anycut.onnx
      - ENVIRONMENT=development
      - SEED_ON_STARTUP=true
      - EXPOSE_DEV_CREDENTIALS=true
      - SEED_LEARNER_PASSWORD=Learner123!
      - SEED_DESIGNER_PASSWORD=Designer123!
      - SEED_ADMIN_PASSWORD=Admin123!
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=affectlearn
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
